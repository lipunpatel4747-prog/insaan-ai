name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Android project banao
        run: |
          flutter create --platforms=android --org com.voiceai --project-name voice_ai voice_app
          cp pubspec.yaml voice_app/pubspec.yaml
          cp lib/main.dart voice_app/lib/main.dart
          M=voice_app/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><application#' $M
          sed -i 's#</queries>#<intent><action android:name="android.speech.RecognitionService"/></intent></queries>#' $M
      - name: Build
        working-directory: voice_app
        run: |
          flutter pub get
          flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: voice_app/build/app/outputs/flutter-apk/app-release.apk
